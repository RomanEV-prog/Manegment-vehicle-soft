version: '3.9'

# Produkcijska konfiguracija — Hetzner VPS
# Zaženi: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: []   # zaprt — Caddy dostopa prek Docker network
    labels:
      caddy: "api.eversum.com"
      caddy.reverse_proxy: "{{upstreams 8000}}"

  celery-worker:
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=2

  celery-beat:
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=warning --scheduler celery.beat.PersistentScheduler

  event-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    command: python -m app.workers.event_consumer
    depends_on:
      - redis
      - db

  db:
    restart: always
    ports: []   # zaprt — samo interno
    environment:
      POSTGRES_DB: eversum_db
      POSTGRES_USER: eversum
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: always
    ports: []   # zaprt — samo interno
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  minio:
    restart: always
    ports: []   # zaprt — MinIO admin samo prek SSH tunnel (ssh -L 9001:localhost:9001 root@VPS_IP)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_in_prod}
    volumes:
      - minio_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports: []   # zaprt — Caddy dostopa prek Docker network
    environment:
      NEXT_PUBLIC_API_URL: https://api.eversum.com
      NEXT_PUBLIC_WS_URL: wss://api.eversum.com

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
